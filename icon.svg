<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#1e1b4b"/>

  <!-- Tab bar track -->
  <rect x="88" y="290" width="848" height="200" rx="36" ry="36" fill="#13114a"/>

  <!-- Active tab -->
  <rect x="108" y="306" width="270" height="168" rx="24" ry="24" fill="#2e2680"/>
  <rect x="108" y="306" width="270" height="168" rx="24" ry="24" fill="none" stroke="#38bdf8" stroke-width="5"/>

  <!-- Inactive tab 2 -->
  <rect x="398" y="306" width="200" height="168" rx="24" ry="24" fill="#1a1760"/>

  <!-- Inactive tab 3 -->
  <rect x="618" y="306" width="200" height="168" rx="24" ry="24" fill="#1a1760"/>

  <!-- Active tab content lines -->
  <rect x="145" y="360" width="130" height="14" rx="7" fill="#38bdf8" opacity="0.7"/>
  <rect x="145" y="386" width="90" height="12" rx="6" fill="#38bdf8" opacity="0.35"/>
  <rect x="145" y="410" width="110" height="12" rx="6" fill="#38bdf8" opacity="0.25"/>

  <!-- Left arrow: shaft + head -->
  <rect x="168" y="590" width="260" height="60" rx="30" fill="#38bdf8"/>
